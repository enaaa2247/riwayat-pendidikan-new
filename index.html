<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar Riwayat Pendidikan</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px auto;
        max-width: 800px;
        padding: 0 20px;
        background-color: #f4f8fb;
      }

      h2 {
        text-align: center;
        color: #1a5276;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        background-color: white;
      }

      th,
      td {
        border: 1px solid #ddd;
        padding: 12px;
        text-align: left;
      }

      th {
        background-color: #1a5276;
        color: white;
      }

      tr:nth-child(even) {
        background-color: #f2f2f2;
      }

      #pesan {
        text-align: center;
        color: #555;
      }
    </style>
  </head>

  <body>
    <h2>Daftar Riwayat Pendidikan</h2>

    <table>
      <thead>
        <tr>
          <th>Nama Sekolah</th>
          <th>Tahun Masuk</th>
          <th>Tahun Lulus</th>
          <th>Keterangan</th>
        </tr>
      </thead>

      <tbody id="isi-tabel">
        <tr>
          <td colspan="4">Memuat data...</td>
        </tr>
      </tbody>
    </table>

    <p id="pesan"></p>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
